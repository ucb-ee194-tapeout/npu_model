# The Atlas instruction set: one entry per instruction.
#
# This table is the source of the encodings. npu_model's instruction classes take their opcode
# and selectors from it, and `python -m npu_model.isa.gen` writes atlas-npu's Instructions.scala,
# the instruction table of npu_spec/06_instruction_set/README.md and the atlas-mlir encoding
# header from it. Do not copy an encoding into another file: generate it.
#
# Top-level keys:
#   configurations  the Atlas configurations
#
# [format.F] gives the bit range of each field of format F: [hi, lo], or, for an immediate that
# the format splits, a list of [hi, lo, at] pieces (word bits hi..lo hold the immediate's bits
# from bit `at` up). Fields with the same bits are names for different uses of these bits.
#
# Keys of an [[instruction]]:
#   mnemonic   the assembly mnemonic
#   format     a format of [format]
#   opcode     inst[6:0]
#   select     the selector fields (funct3, funct7, ...) and their values
#   fixed      other fields that must have the given value (optional)
#   operands   the operand fields and their kinds:
#                x, e           x-register x0-x31 or e-register e0-e31
#                m              m-register m0-m63
#                mp             BF16 tile {m[r], m[r+1]}: r is even
#                mq             FP32 tile m[r..r+3]: r is a multiple of 4
#                acc, w         accumulator or weight slot of the MXU: 0 or 1
#                ch             DMA channel ch0-ch7
#                imm, uimm      signed or unsigned immediate
#                uimm8, uimm12  unsigned immediate below 2^8 or 2^12
#                hex            immediate that holds a bit pattern (shown in hex)
#                label          branch or jump offset
#   syntax     the assembly syntax: x(rd), m(vd), ... name a register operand and its field, and
#              a bare field name (imm, csr, ch, ...) names any other operand
#   unit       the unit that executes it: scalar, lsu, vpu, xlu, mxu1, nv or dma
#   configs    the configurations that have the unit (optional; all if not given)
#   m          the rows of a tensor register that it reads and writes (optional): "rows" for
#              rows 0..M-1 (M is 32), "all" for all 32 rows
#   operation  what it does, in one line
#   ver        the ISA version that added it or last changed its encoding or operation; the
#              highest ver is the ISA version (CSR atlas.isa)
#
# A kind fixes the bits of its field that it does not use to zero: a word with an odd pair
# register, an e-register above e31 in a 6-bit field or an accumulator above acc1 is illegal. In a
# custom opcode (0x0B, 0x2B, 0x5B, 0x7B), every bit is in select, fixed or operands. In an RV32I
# opcode, the bits that are not in them are not decoded: they can have any value.

configurations = ["default", "ipt-nvfp4"]

[format.R]
opcode = [6, 0]
rd = [11, 7]
funct3 = [14, 12]
ch = [14, 12]
rs1 = [19, 15]
rs2 = [24, 20]
funct7 = [31, 25]

[format.I]
opcode = [6, 0]
rd = [11, 7]
funct3 = [14, 12]
rs1 = [19, 15]
uimm = [19, 15]
imm = [31, 20]
csr = [31, 20]
shamt = [24, 20]
funct7 = [31, 25]

[format.S]
opcode = [6, 0]
funct3 = [14, 12]
rs1 = [19, 15]
rs2 = [24, 20]
imm = [[31, 25, 5], [11, 7, 0]]

[format.B]
opcode = [6, 0]
funct3 = [14, 12]
rs1 = [19, 15]
rs2 = [24, 20]
offset = [[31, 31, 12], [30, 25, 5], [11, 8, 1], [7, 7, 11]]

[format.U]
opcode = [6, 0]
rd = [11, 7]
imm = [31, 12]

[format.J]
opcode = [6, 0]
rd = [11, 7]
offset = [[31, 31, 20], [30, 21, 1], [20, 20, 11], [19, 12, 12]]

[format.VR]
opcode = [6, 0]
vd = [12, 7]
vs1 = [18, 13]
vs2 = [24, 19]
rs2 = [24, 20]
vs2lsb = [19, 19]
funct7 = [31, 25]

[format.VI]
opcode = [6, 0]
vd = [12, 7]
funct3 = [15, 13]
imm = [31, 16]

[format.VLS]
opcode = [6, 0]
vd = [12, 7]
funct2 = [14, 13]
rs1 = [19, 15]
imm = [31, 20]

# ---- RV32I: register-register ALU ---------------------------------------------------------------

[[instruction]]
mnemonic = "add"
format = "R"
opcode = 0x33
select = { funct3 = 0, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "add x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = x[rs1] + x[rs2]"
ver = "1.0"

[[instruction]]
mnemonic = "sub"
format = "R"
opcode = 0x33
select = { funct3 = 0, funct7 = 0x20 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "sub x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = x[rs1] - x[rs2]"
ver = "1.0"

[[instruction]]
mnemonic = "sll"
format = "R"
opcode = 0x33
select = { funct3 = 1, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "sll x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = x[rs1] << x[rs2][4:0]"
ver = "1.0"

[[instruction]]
mnemonic = "slt"
format = "R"
opcode = 0x33
select = { funct3 = 2, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "slt x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = ($signed(x[rs1]) < $signed(x[rs2]))"
ver = "1.0"

[[instruction]]
mnemonic = "sltu"
format = "R"
opcode = 0x33
select = { funct3 = 3, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "sltu x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = (x[rs1] < x[rs2])"
ver = "1.0"

[[instruction]]
mnemonic = "xor"
format = "R"
opcode = 0x33
select = { funct3 = 4, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "xor x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = x[rs1] ^ x[rs2]"
ver = "1.0"

[[instruction]]
mnemonic = "srl"
format = "R"
opcode = 0x33
select = { funct3 = 5, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "srl x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = x[rs1] >> x[rs2][4:0]"
ver = "1.0"

[[instruction]]
mnemonic = "sra"
format = "R"
opcode = 0x33
select = { funct3 = 5, funct7 = 0x20 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "sra x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = $signed(x[rs1]) >>> x[rs2][4:0]"
ver = "1.0"

[[instruction]]
mnemonic = "or"
format = "R"
opcode = 0x33
select = { funct3 = 6, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "or x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = x[rs1] | x[rs2]"
ver = "1.0"

[[instruction]]
mnemonic = "and"
format = "R"
opcode = 0x33
select = { funct3 = 7, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x" }
syntax = "and x(rd), x(rs1), x(rs2)"
unit = "scalar"
operation = "x[rd] = x[rs1] & x[rs2]"
ver = "1.0"

# ---- RV32I: register-immediate ALU --------------------------------------------------------------

[[instruction]]
mnemonic = "addi"
format = "I"
opcode = 0x13
select = { funct3 = 0 }
operands = { rd = "x", rs1 = "x", imm = "imm" }
syntax = "addi x(rd), x(rs1), imm"
unit = "scalar"
operation = "x[rd] = x[rs1] + imm"
ver = "1.0"

[[instruction]]
mnemonic = "slti"
format = "I"
opcode = 0x13
select = { funct3 = 2 }
operands = { rd = "x", rs1 = "x", imm = "imm" }
syntax = "slti x(rd), x(rs1), imm"
unit = "scalar"
operation = "x[rd] = ($signed(x[rs1]) < $signed(imm))"
ver = "1.0"

[[instruction]]
mnemonic = "sltiu"
format = "I"
opcode = 0x13
select = { funct3 = 3 }
operands = { rd = "x", rs1 = "x", imm = "imm" }
syntax = "sltiu x(rd), x(rs1), imm"
unit = "scalar"
operation = "x[rd] = (x[rs1] < $unsigned($signed(imm)))"
ver = "1.0"

[[instruction]]
mnemonic = "xori"
format = "I"
opcode = 0x13
select = { funct3 = 4 }
operands = { rd = "x", rs1 = "x", imm = "imm" }
syntax = "xori x(rd), x(rs1), imm"
unit = "scalar"
operation = "x[rd] = x[rs1] ^ imm"
ver = "1.0"

[[instruction]]
mnemonic = "ori"
format = "I"
opcode = 0x13
select = { funct3 = 6 }
operands = { rd = "x", rs1 = "x", imm = "imm" }
syntax = "ori x(rd), x(rs1), imm"
unit = "scalar"
operation = "x[rd] = x[rs1] | imm"
ver = "1.0"

[[instruction]]
mnemonic = "andi"
format = "I"
opcode = 0x13
select = { funct3 = 7 }
operands = { rd = "x", rs1 = "x", imm = "imm" }
syntax = "andi x(rd), x(rs1), imm"
unit = "scalar"
operation = "x[rd] = x[rs1] & imm"
ver = "1.0"

[[instruction]]
mnemonic = "slli"
format = "I"
opcode = 0x13
select = { funct3 = 1, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", shamt = "uimm" }
syntax = "slli x(rd), x(rs1), shamt"
unit = "scalar"
operation = "x[rd] = x[rs1] << shamt"
ver = "1.0"

[[instruction]]
mnemonic = "srli"
format = "I"
opcode = 0x13
select = { funct3 = 5, funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", shamt = "uimm" }
syntax = "srli x(rd), x(rs1), shamt"
unit = "scalar"
operation = "x[rd] = x[rs1] >> shamt"
ver = "1.0"

[[instruction]]
mnemonic = "srai"
format = "I"
opcode = 0x13
select = { funct3 = 5, funct7 = 0x20 }
operands = { rd = "x", rs1 = "x", shamt = "uimm" }
syntax = "srai x(rd), x(rs1), shamt"
unit = "scalar"
operation = "x[rd] = $signed(x[rs1]) >>> shamt"
ver = "1.0"

# ---- RV32I: control flow (pc is a byte address; a taken target with bit 1 set is illegal) -------

[[instruction]]
mnemonic = "beq"
format = "B"
opcode = 0x63
select = { funct3 = 0 }
operands = { rs1 = "x", rs2 = "x", offset = "label" }
syntax = "beq x(rs1), x(rs2), offset"
unit = "scalar"
operation = "if (x[rs1] == x[rs2]) pc = pc + offset"
ver = "2.0"

[[instruction]]
mnemonic = "bne"
format = "B"
opcode = 0x63
select = { funct3 = 1 }
operands = { rs1 = "x", rs2 = "x", offset = "label" }
syntax = "bne x(rs1), x(rs2), offset"
unit = "scalar"
operation = "if (x[rs1] != x[rs2]) pc = pc + offset"
ver = "2.0"

[[instruction]]
mnemonic = "blt"
format = "B"
opcode = 0x63
select = { funct3 = 4 }
operands = { rs1 = "x", rs2 = "x", offset = "label" }
syntax = "blt x(rs1), x(rs2), offset"
unit = "scalar"
operation = "if ($signed(x[rs1]) < $signed(x[rs2])) pc = pc + offset"
ver = "2.0"

[[instruction]]
mnemonic = "bge"
format = "B"
opcode = 0x63
select = { funct3 = 5 }
operands = { rs1 = "x", rs2 = "x", offset = "label" }
syntax = "bge x(rs1), x(rs2), offset"
unit = "scalar"
operation = "if ($signed(x[rs1]) >= $signed(x[rs2])) pc = pc + offset"
ver = "2.0"

[[instruction]]
mnemonic = "bltu"
format = "B"
opcode = 0x63
select = { funct3 = 6 }
operands = { rs1 = "x", rs2 = "x", offset = "label" }
syntax = "bltu x(rs1), x(rs2), offset"
unit = "scalar"
operation = "if (x[rs1] < x[rs2]) pc = pc + offset"
ver = "2.0"

[[instruction]]
mnemonic = "bgeu"
format = "B"
opcode = 0x63
select = { funct3 = 7 }
operands = { rs1 = "x", rs2 = "x", offset = "label" }
syntax = "bgeu x(rs1), x(rs2), offset"
unit = "scalar"
operation = "if (x[rs1] >= x[rs2]) pc = pc + offset"
ver = "2.0"

[[instruction]]
mnemonic = "jal"
format = "J"
opcode = 0x6F
operands = { rd = "x", offset = "label" }
syntax = "jal x(rd), offset"
unit = "scalar"
operation = "x[rd] = pc + 4; pc = pc + offset"
ver = "2.0"

[[instruction]]
mnemonic = "jalr"
format = "I"
opcode = 0x67
select = { funct3 = 0 }
operands = { rd = "x", rs1 = "x", imm = "imm" }
syntax = "jalr x(rd), x(rs1), imm"
unit = "scalar"
operation = "next_pc = (x[rs1] + imm) & ~1; x[rd] = pc + 4; pc = next_pc"
ver = "2.0"

[[instruction]]
mnemonic = "lui"
format = "U"
opcode = 0x37
operands = { rd = "x", imm = "hex" }
syntax = "lui x(rd), imm"
unit = "scalar"
operation = "x[rd] = {imm, 12'b0}"
ver = "1.0"

[[instruction]]
mnemonic = "auipc"
format = "U"
opcode = 0x17
operands = { rd = "x", imm = "hex" }
syntax = "auipc x(rd), imm"
unit = "scalar"
operation = "x[rd] = pc + {imm, 12'b0}"
ver = "2.0"

# ---- RV32I: system ------------------------------------------------------------------------------

[[instruction]]
mnemonic = "csrrw"
format = "I"
opcode = 0x73
select = { funct3 = 1 }
operands = { rd = "x", csr = "hex", rs1 = "x" }
syntax = "csrrw x(rd), csr, x(rs1)"
unit = "scalar"
operation = "x[rd] = CSR[csr]; CSR[csr] = x[rs1]"
ver = "1.0"

[[instruction]]
mnemonic = "csrrs"
format = "I"
opcode = 0x73
select = { funct3 = 2 }
operands = { rd = "x", csr = "hex", rs1 = "x" }
syntax = "csrrs x(rd), csr, x(rs1)"
unit = "scalar"
operation = "x[rd] = CSR[csr]; if (rs1 != 0) CSR[csr] = CSR[csr] | x[rs1]"
ver = "1.0"

[[instruction]]
mnemonic = "csrrc"
format = "I"
opcode = 0x73
select = { funct3 = 3 }
operands = { rd = "x", csr = "hex", rs1 = "x" }
syntax = "csrrc x(rd), csr, x(rs1)"
unit = "scalar"
operation = "x[rd] = CSR[csr]; if (rs1 != 0) CSR[csr] = CSR[csr] & ~x[rs1]"
ver = "1.0"

[[instruction]]
mnemonic = "csrrwi"
format = "I"
opcode = 0x73
select = { funct3 = 5 }
operands = { rd = "x", csr = "hex", uimm = "uimm" }
syntax = "csrrwi x(rd), csr, uimm"
unit = "scalar"
operation = "x[rd] = CSR[csr]; CSR[csr] = uimm"
ver = "1.0"

[[instruction]]
mnemonic = "csrrsi"
format = "I"
opcode = 0x73
select = { funct3 = 6 }
operands = { rd = "x", csr = "hex", uimm = "uimm" }
syntax = "csrrsi x(rd), csr, uimm"
unit = "scalar"
operation = "x[rd] = CSR[csr]; if (uimm != 0) CSR[csr] = CSR[csr] | uimm"
ver = "1.0"

[[instruction]]
mnemonic = "csrrci"
format = "I"
opcode = 0x73
select = { funct3 = 7 }
operands = { rd = "x", csr = "hex", uimm = "uimm" }
syntax = "csrrci x(rd), csr, uimm"
unit = "scalar"
operation = "x[rd] = CSR[csr]; if (uimm != 0) CSR[csr] = CSR[csr] & ~uimm"
ver = "1.0"

[[instruction]]
mnemonic = "ecall"
format = "I"
opcode = 0x73
select = { funct3 = 0, imm = 0x000 }
fixed = { rd = 0, rs1 = 0 }
operands = {}
syntax = "ecall"
unit = "scalar"
operation = "halt_reason = ECALL; halt = 1'b1"
ver = "1.0"

[[instruction]]
mnemonic = "ebreak"
format = "I"
opcode = 0x73
select = { funct3 = 0, imm = 0x001 }
fixed = { rd = 0, rs1 = 0 }
operands = {}
syntax = "ebreak"
unit = "scalar"
operation = "halt_reason = EBREAK; halt = 1'b1"
ver = "1.0"

[[instruction]]
mnemonic = "fence"
format = "I"
opcode = 0x0F
select = { funct3 = 0 }
operands = {}
syntax = "fence"
unit = "scalar"
operation = "no operation"
ver = "1.0"

# ---- Scalar loads and stores (VMEM byte addresses) ----------------------------------------------

[[instruction]]
mnemonic = "lb"
format = "I"
opcode = 0x03
select = { funct3 = 0 }
operands = { rd = "x", imm = "imm", rs1 = "x" }
syntax = "lb x(rd), imm(x(rs1))"
unit = "lsu"
operation = "x[rd] = {{24{VMEM[x[rs1] + imm][7]}}, VMEM[x[rs1] + imm]}"
ver = "1.0"

[[instruction]]
mnemonic = "lh"
format = "I"
opcode = 0x03
select = { funct3 = 1 }
operands = { rd = "x", imm = "imm", rs1 = "x" }
syntax = "lh x(rd), imm(x(rs1))"
unit = "lsu"
operation = "x[rd] = {{16{VMEM[x[rs1] + imm][15]}}, VMEM[x[rs1] + imm]}"
ver = "1.0"

[[instruction]]
mnemonic = "lw"
format = "I"
opcode = 0x03
select = { funct3 = 2 }
operands = { rd = "x", imm = "imm", rs1 = "x" }
syntax = "lw x(rd), imm(x(rs1))"
unit = "lsu"
operation = "x[rd] = VMEM[x[rs1] + imm]"
ver = "1.0"

[[instruction]]
mnemonic = "lbu"
format = "I"
opcode = 0x03
select = { funct3 = 4 }
operands = { rd = "x", imm = "imm", rs1 = "x" }
syntax = "lbu x(rd), imm(x(rs1))"
unit = "lsu"
operation = "x[rd] = {24'b0, VMEM[x[rs1] + imm]}"
ver = "1.0"

[[instruction]]
mnemonic = "lhu"
format = "I"
opcode = 0x03
select = { funct3 = 5 }
operands = { rd = "x", imm = "imm", rs1 = "x" }
syntax = "lhu x(rd), imm(x(rs1))"
unit = "lsu"
operation = "x[rd] = {16'b0, VMEM[x[rs1] + imm]}"
ver = "1.0"

[[instruction]]
mnemonic = "sb"
format = "S"
opcode = 0x23
select = { funct3 = 0 }
operands = { rs2 = "x", imm = "imm", rs1 = "x" }
syntax = "sb x(rs2), imm(x(rs1))"
unit = "lsu"
operation = "VMEM[x[rs1] + imm] = x[rs2][7:0]"
ver = "1.0"

[[instruction]]
mnemonic = "sh"
format = "S"
opcode = 0x23
select = { funct3 = 1 }
operands = { rs2 = "x", imm = "imm", rs1 = "x" }
syntax = "sh x(rs2), imm(x(rs1))"
unit = "lsu"
operation = "VMEM[x[rs1] + imm] = x[rs2][15:0]"
ver = "1.0"

[[instruction]]
mnemonic = "sw"
format = "S"
opcode = 0x23
select = { funct3 = 2 }
operands = { rs2 = "x", imm = "imm", rs1 = "x" }
syntax = "sw x(rs2), imm(x(rs1))"
unit = "lsu"
operation = "VMEM[x[rs1] + imm] = x[rs2]"
ver = "1.0"

# ---- Scale registers and issue delay ------------------------------------------------------------

[[instruction]]
mnemonic = "seld"
format = "R"
opcode = 0x7B
select = { funct7 = 0x04 }
fixed = { funct3 = 0, rs2 = 0 }
operands = { rd = "e", rs1 = "x" }
syntax = "seld e(rd), x(rs1)"
unit = "lsu"
operation = "e[rd] = VMEM[x[rs1]]"
ver = "2.0"

[[instruction]]
mnemonic = "seli"
format = "VI"
opcode = 0x2B
select = { funct3 = 4 }
operands = { vd = "e", imm = "uimm8" }
syntax = "seli e(vd), imm"
unit = "scalar"
operation = "e[vd] = imm"
ver = "2.0"

[[instruction]]
mnemonic = "delay"
format = "VI"
opcode = 0x2B
select = { funct3 = 5 }
fixed = { vd = 0 }
operands = { imm = "uimm12" }
syntax = "delay imm"
unit = "scalar"
operation = "hold decode issue for imm cycles"
ver = "2.0"

# ---- Tensor loads and stores (VMEM word addresses) ----------------------------------------------

[[instruction]]
mnemonic = "vload"
format = "VLS"
opcode = 0x5B
select = { funct2 = 0 }
operands = { vd = "m", imm = "imm", rs1 = "x" }
syntax = "vload m(vd), imm(x(rs1))"
unit = "lsu"
m = "rows"
operation = "m[vd] = VMEM[x[rs1] + (imm << 5)]"
ver = "2.0"

[[instruction]]
mnemonic = "vstore"
format = "VLS"
opcode = 0x5B
select = { funct2 = 1 }
operands = { vd = "m", imm = "imm", rs1 = "x" }
syntax = "vstore m(vd), imm(x(rs1))"
unit = "lsu"
m = "rows"
operation = "VMEM[x[rs1] + (imm << 5)] = m[vd]"
ver = "2.0"

[[instruction]]
mnemonic = "vload.scale"
format = "VLS"
opcode = 0x5B
select = { funct2 = 2 }
operands = { vd = "m", imm = "imm", rs1 = "x" }
syntax = "vload.scale m(vd), imm(x(rs1))"
unit = "lsu"
configs = ["ipt-nvfp4"]
m = "all"
operation = "scales of m[vd] = 128 B of VMEM at x[rs1] + (imm << 5)"
ver = "2.0"

[[instruction]]
mnemonic = "vstore.scale"
format = "VLS"
opcode = 0x5B
select = { funct2 = 3 }
operands = { vd = "m", imm = "imm", rs1 = "x" }
syntax = "vstore.scale m(vd), imm(x(rs1))"
unit = "lsu"
configs = ["ipt-nvfp4"]
