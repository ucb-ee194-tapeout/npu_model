ver = "2.0"

# ---- DMA (VMEM word addresses) ------------------------------------------------------------------

[[instruction]]
mnemonic = "dma.load"
format = "R"
opcode = 0x7B
select = { funct7 = 0x00 }
operands = { rd = "x", rs1 = "x", rs2 = "x", ch = "ch" }
syntax = "dma.load x(rd), x(rs1), x(rs2), ch"
unit = "dma"
operation = "channel ch: VMEM[x[rd]] = DRAM[{dma.base, x[rs1]}], x[rs2] bytes"
ver = "1.0"

[[instruction]]
mnemonic = "dma.store"
format = "R"
opcode = 0x7B
select = { funct7 = 0x01 }
operands = { rd = "x", rs1 = "x", rs2 = "x", ch = "ch" }
syntax = "dma.store x(rd), x(rs1), x(rs2), ch"
unit = "dma"
operation = "channel ch: DRAM[{dma.base, x[rd]}] = VMEM[x[rs1]], x[rs2] bytes"
ver = "1.0"

[[instruction]]
mnemonic = "dma.config"
format = "R"
opcode = 0x7B
select = { funct7 = 0x02 }
fixed = { rd = 0, rs2 = 0 }
operands = { rs1 = "x", ch = "ch" }
syntax = "dma.config x(rs1), ch"
unit = "dma"
operation = "dma.base = x[rs1]"
ver = "2.0"

[[instruction]]
mnemonic = "dma.wait"
format = "R"
opcode = 0x7B
select = { funct7 = 0x03 }
fixed = { rd = 0, rs1 = 0, rs2 = 0 }
operands = { ch = "ch" }
syntax = "dma.wait ch"
unit = "dma"
operation = "hold issue until channel ch is idle"
ver = "2.0"

