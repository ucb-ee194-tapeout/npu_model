[[instruction]]
mnemonic = "vli.one"
format = "VI"
opcode = 0x5F
select = { funct3 = 3 }
operands = { vd = "m", imm = "hex" }
syntax = "vli.one m(vd), imm"
unit = "vpu"
m = "rows"
operation = "m[vd][0, 0] = imm; the other elements = 0"
ver = "1.0"

# ---- XLU -----------------------------------------------------------------------------------------

[[instruction]]
mnemonic = "vtrpose.xlu"
format = "VR"
opcode = 0x6B
select = { funct7 = 0x00 }
operands = { vd = "m", vs1 = "m" }
syntax = "vtrpose.xlu m(vd), m(vs1)"
unit = "xlu"
m = "all"
operation = "m[vd] = m[vs1]^T (32 x 32 bytes)"
ver = "1.0"
